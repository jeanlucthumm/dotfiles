<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE — 3D explainer</title>
<style>
  :root {
    --ink: #1a2233;
    --muted: #5b6472;
    --line: #d8dde6;
    --panel-bg: rgba(255,255,255,.92);
    --accent: #2563eb;
    --gold: #b45309;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
    background: #eef2f7; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- top bar ---- */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
    display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 18px; gap: 12px; }
  #title-card { pointer-events: auto; background: var(--panel-bg); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: 0 4px 16px rgba(15,23,42,.10); max-width: 520px; }
  #title-card h1 { margin: 0; font-size: 16px; letter-spacing: .2px; }
  #title-card p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  #controls-hint { pointer-events: auto; background: var(--panel-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; color: var(--muted); box-shadow: 0 4px 16px rgba(15,23,42,.08); }
  #controls-hint b { color: var(--ink); font-weight: 600; }

  /* ---- flow player ---- */
  #flowbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; max-width: min(860px, 94vw); }
  #caption { pointer-events: auto; display: none; background: #1a2233; color: #fff; border-radius: 10px;
    padding: 10px 16px; font-size: 13.5px; max-width: 720px; box-shadow: 0 6px 24px rgba(15,23,42,.25); text-align: center; }
  #caption .step-n { color: #93c5fd; font-weight: 700; margin-right: 8px; }
  #caption code { background: rgba(255,255,255,.14); color: #bfdbfe; }
  #flow-buttons { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: var(--panel-bg); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px; box-shadow: 0 4px 16px rgba(15,23,42,.12); }
  #flow-buttons button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  #flow-buttons button:hover { border-color: var(--accent); color: var(--accent); }
  #flow-buttons button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #flow-buttons button.stop { color: #b42318; }
  #flow-buttons .sep { width: 1px; background: var(--line); margin: 2px 2px; }

  /* ---- node info panel ---- */
  #panel { position: fixed; top: 78px; right: 18px; z-index: 20; width: 360px; max-height: calc(100vh - 180px);
    overflow: auto; background: var(--panel-bg); backdrop-filter: blur(6px); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 10px 32px rgba(15,23,42,.16); padding: 16px 18px; display: none; }
  #panel .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  #panel h2 { margin: 2px 0 8px; font-size: 17px; }
  #panel .body { font-size: 13px; color: #2c3546; }
  #panel .body p { margin: 0 0 8px; }
  #panel .body ul { margin: 0 0 8px; padding-left: 18px; }
  #panel .body li { margin-bottom: 4px; }
  #panel .paths { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  #panel .paths div { font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
  #panel .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 18px;
    color: var(--muted); cursor: pointer; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #eef2f7; border-radius: 4px; padding: 1px 4px; }

  /* ---- legend ---- */
  #legend { position: fixed; left: 18px; bottom: 18px; z-index: 20; background: var(--panel-bg); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(15,23,42,.10);
    font-size: 12px; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .chip { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
  #legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  #legend h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  #legend .toggle-row { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  #legend label { display: flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }

  /* ---- 3D labels ---- */
  #labels { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
    background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px;
    font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(15,23,42,.10); transition: opacity .15s; }
  .lbl small { display: block; font-weight: 400; font-size: 10px; color: var(--muted); line-height: 1.2; }
  .lbl.zone { background: none; border: 0; box-shadow: none; font-size: 12px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: rgba(43,54,72,.55); pointer-events: none; }
  .lbl.dim { opacity: .25; }
  .lbl.hot { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.25), 0 2px 8px rgba(15,23,42,.10); }
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<div id="topbar">
  <div id="title-card">
    <h1>TITLE</h1>
    <p>SUBTITLE — one line naming the path through the system.
       Orbit around it, click any building, or play a data flow below.</p>
  </div>
  <div id="controls-hint"><b>drag</b> orbit · <b>right-drag / two-finger</b> pan · <b>scroll</b> zoom · <b>click</b> inspect</div>
</div>

<div id="panel">
  <button class="close" title="Close">×</button>
  <div class="kicker"></div>
  <h2></h2>
  <div class="body"></div>
  <div class="paths"></div>
</div>

<div id="legend">
  <h3>Zones</h3>
  <div id="legend-zones"></div>
  <h3 style="margin-top:8px">Traffic</h3>
  <div id="legend-traffic"></div>
  <div class="toggle-row">
    <label><input type="checkbox" id="toggle-ambient" checked> ambient traffic</label>
    <label><input type="checkbox" id="toggle-rotate"> slow auto-orbit</label>
  </div>
</div>

<div id="flowbar">
  <div id="caption"></div>
  <div id="flow-buttons"></div>
</div>
